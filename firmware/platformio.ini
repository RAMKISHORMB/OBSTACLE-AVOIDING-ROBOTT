; PlatformIO Project Configuration File for ESP32 Autonomous Robot
; Autonomous Obstacle Avoiding Mobile Robot Firmware

[platformio]
default_envs = esp32dev
description = Modular Embedded C++ Firmware for Two-Wheel Differential Drive Autonomous Robot

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D FIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^3.0.5

check_tool = cppcheck
check_flags =
    --enable=all
    --suppress=missingIncludeSystem
